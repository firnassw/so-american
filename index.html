<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics to ASCII Art with Photo</title>
  <style>
    :root {
      --color-primary: #ffffff;
      --color-secondary: #75d8ee;
      --color-surface: #271c22;
      --brightness: 1.4;
    }

    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      background: #000000;
      color: var(--color-primary);
      overflow: hidden; 
      cursor: pointer;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #output {
      text-align: center;
      font-family: "SF Mono", monospace;
      filter: drop-shadow(0 0 7rem color-mix(in srgb, var(--color), transparent 20%)) brightness(var(--brightness));
      white-space: nowrap;
      background: black;
      
      font-size: 1.11vh;       
      line-height: 1.11vh;
      letter-spacing: 0.45vh; 

      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #prerender {
      display: none;
    }

    audio, img {
      display: none; 
    }

    .player-controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 999;
      transition: opacity 0.6s ease;
    }

    .side-visual {
      font-family: "SF Mono", monospace;
      font-size: 12px;
      color: var(--color-secondary);
      letter-spacing: 2px;
      opacity: 0.7;
      user-select: none;
    }

    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--color-secondary), transparent 60%);
      background: var(--color-surface);
      color: var(--color-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.65;
      padding: 0;
      box-shadow: 0 0 16px color-mix(in srgb, var(--color-secondary), transparent 65%);
      transition: opacity 0.3s ease, transform 0.15s ease, background-color 0.3s;
    }

    .play-btn:hover {
      opacity: 1;
      transform: scale(1.08);
    }

    .play-btn:active {
      transform: scale(0.94);
    }

    .play-btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    * {
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="output"></div>
  <audio id="song" src="Olivia Rodrigo - so american.mp3" loop crossorigin="anonymous"></audio>
  <img id="bgImage" src="gambar-background.jpeg" crossorigin="anonymous">

  <div class="player-controls" id="playerControls">
    <div class="side-visual">&lt;&lt; ==</div>
    <button id="playBtn" class="play-btn" aria-label="Play or pause">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="side-visual">== &gt;&gt;</div>
  </div>
</div>

<canvas id="prerender" width="160" height="90"></canvas>

<script>
  (() => {
    const config = {
      lyrics: [
        { text: "And he laughs at all my jokes", startTime: 0, endTime: 2.1 },
        { text: "And he says I'm so American", startTime: 2.1, endTime: 5.0 },
        { text: "Oh, God, it's just not fair of him", startTime: 5.0, endTime: 7.5 },
        { text: "To make me feel this much", startTime: 7.5, endTime: 10.0 },
        { text: "I'd go anywhere he goes", startTime: 10.0, endTime: 12.5 },
        { text: "And he says I'm so American", startTime: 12.5, endTime: 15.3 },
        { text: "Oh, God, I'm gonna marry him", startTime: 15.3, endTime: 18.0 },
        { text: "If he keeps this shit up", startTime: 18.0, endTime: 20.7 },
        { text: "I might just be in ", startTime: 20.7, endTime: 21.8 },
        { text: "lo-lo-, lo-lo-, lo-lo-, lo-lo-lo-lo-love", startTime: 21.8, endTime: 26.0 },
        { text: "I apologize if it's a little too much,", startTime: 25.7, endTime: 29 },
        { text: "just a little too soon", startTime: 29, endTime: 31.0 },
        { text: "But if the conversation ever were to come up", startTime: 31.0, endTime: 34.4 },
        { text: "I don't wanna assume", startTime: 34.4, endTime: 35.7 },
        { text: "this stuff . . . .", startTime: 35.7, endTime: 38.8 },
        { text: "But ain't it love? . . . ", startTime: 38.8, endTime: 40.0 }
      ],
      isLooping: true,      
      maxColorIndex: 700,
      fadeDuration: 0.2 
    };

    const canvas = document.getElementById("prerender");
    const output = document.getElementById("output");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    
    const audio = document.getElementById("song");
    const bgImage = document.getElementById("bgImage"); 
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const playerControls = document.getElementById("playerControls");
    
    const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
    const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

    document.body.addEventListener("click", (e) => {
      if(e.target.closest('#playBtn')) return;
      if (audio.paused) {
        audio.play().catch(e => {});
      } else {
        audio.pause();
      }
    });

    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().catch(e => {});
      } else {
        audio.pause();
      }
    });

    audio.addEventListener("play", () => { playIcon.innerHTML = ICON_PAUSE; });
    audio.addEventListener("pause", () => { playIcon.innerHTML = ICON_PLAY; });
    audio.addEventListener("ended", () => { playIcon.innerHTML = ICON_PAUSE; });

    let audioCtx, analyser, source, dataArray;
    let isAudioSetup = false;

    const setupAudio = () => {
      if (isAudioSetup) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 64; 
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        isAudioSetup = true;
      } catch (error) {}
    };

    audio.addEventListener('play', () => {
      setupAudio();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    });

    const drawPlayerUI = (isPhotoPhase) => {
      if (isPhotoPhase) return;

      const w = canvas.width;
      const eqBaseY = 74; 
      const lineY = 80;   

      if (isAudioSetup && !audio.paused && dataArray) {
        analyser.getByteFrequencyData(dataArray);
        const activeBins = 16; 
        const spacing = 1.5; 
        const barW = 1;
        const totalWidth = activeBins * 2 * spacing;
        const startX = (w - totalWidth) / 2; 

        ctx.fillStyle = "rgb(180, 180, 180)"; 
        for (let i = 0; i < activeBins; i++) {
          const amplitude = dataArray[i]; 
          const barHeight = (amplitude / 255) * 2; 
          if (barHeight > 0.2) {
            ctx.fillRect(startX + (activeBins + i) * spacing, eqBaseY - barHeight, barW, barHeight * 2);
            ctx.fillRect(startX + (activeBins - 1 - i) * spacing, eqBaseY - barHeight, barW, barHeight * 2);
          }
        }
      } else {
        ctx.fillStyle = "rgb(180, 180, 180)";
        ctx.fillRect((w/2) - 15, eqBaseY - 0.5, 30, 1);
      }

      ctx.fillStyle = "rgb(120, 120, 120)"; 
      ctx.fillRect(10, lineY, w - 20, 1); 
    };

    const drawTextToCanvas = (textToDraw, opacity, isPhotoPhase) => {
      if (!textToDraw || opacity <= 0) return; 

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      
      let fontSize = 12;
      let fontFamily = 'Arial, Helvetica, sans-serif';
      let fontWeight = 'bold';

      if (isPhotoPhase) {
        fontSize = 14; // Ukuran diperkecil agar lirik tidak memakan seluruh layar
        fontFamily = '"Arial Black", Impact, sans-serif';
        fontWeight = '900'; 
      }
      
      ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
      
      const words = textToDraw.split(" ");
      let lines = [];
      let currentLine = words[0] || "";

      for (let i = 1; i < words.length; i++) {
        let word = words[i];
        let width = ctx.measureText(currentLine + " " + word).width;
        let maxWidth = isPhotoPhase ? canvas.width - 10 : canvas.width - 20;
        
        if (width < maxWidth) { 
          currentLine += " " + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);

      const lineHeight = fontSize + (isPhotoPhase ? 3 : 2); 
      const totalHeight = lines.length * lineHeight;
      let startY = (canvas.height / 2) - (totalHeight / 2) + (lineHeight / 2);

      for (let i = 0; i < lines.length; i++) {
        if (isPhotoPhase) {
          ctx.lineWidth = 2; // Garis tepi dipertipis agar lebih bersih
          ctx.strokeStyle = `rgba(0, 0, 0, ${opacity})`;
          ctx.strokeText(lines[i], canvas.width / 2, startY + (i * lineHeight));
        }
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`; 
        ctx.fillText(lines[i], canvas.width / 2, startY + (i * lineHeight));
      }
    };

    const charsFixed = [
      "_", ".", ",", "-", "=", "+", "i", "s", "c", "b", "a", "!", "?",
      "0", "1", "2", "3", "4", "5", "6",
      ["9", "8"],
      ["✚", "✚", "✚", "✚", "✚", "⚛︎"],
      ["☺︎", "☹︎"],
      "☀︎",
      ["@", "#"],
      ["X", "Y", "Z"],
      "'"
    ];
    let charsLength = charsFixed.length;

    const updateASCII = () => {
      try {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const currentTime = audio ? audio.currentTime : 0;
        const isPhotoPhase = currentTime >= 21.8;

        if (isPhotoPhase) {
          playerControls.style.opacity = '0';
          playerControls.style.pointerEvents = 'none'; 
        } else {
          playerControls.style.opacity = '1';
          playerControls.style.pointerEvents = 'auto';
        }

        if (isPhotoPhase && bgImage && bgImage.complete && bgImage.naturalWidth > 0) {
          const imgRatio = bgImage.naturalWidth / bgImage.naturalHeight;
          const canvasRatio = canvas.width / canvas.height;
          let drawW, drawH, drawX, drawY;

          if (imgRatio > canvasRatio) {
            drawH = canvas.height;
            drawW = bgImage.naturalWidth * (canvas.height / bgImage.naturalHeight);
            drawX = (canvas.width - drawW) / 2;
            drawY = 0;
          } else {
            drawW = canvas.width;
            drawH = bgImage.naturalHeight * (canvas.width / bgImage.naturalWidth);
            drawX = 0;
            drawY = (canvas.height - drawH) / 2;
          }
          ctx.drawImage(bgImage, drawX, drawY, drawW, drawH);
        }

        let currentActiveText = "";
        let textOpacity = 1;
        const activeLyric = config.lyrics.find(
          (lyric) => currentTime >= lyric.startTime && currentTime <= lyric.endTime
        );

        if (activeLyric) {
          currentActiveText = activeLyric.text;
          if (!audio.paused) {
            const timeIn = currentTime - activeLyric.startTime;
            const timeOut = activeLyric.endTime - currentTime;
            if (timeIn < config.fadeDuration) {
              textOpacity = Math.max(0, timeIn / config.fadeDuration);
            } else if (timeOut < config.fadeDuration) {
              textOpacity = Math.max(0, timeOut / config.fadeDuration);
            }
          }
        } else {
          textOpacity = 0;
        }

        drawTextToCanvas(currentActiveText, textOpacity, isPhotoPhase);
        drawPlayerUI(isPhotoPhase); 

        const w = canvas.width;
        const h = canvas.height;
        const data = ctx.getImageData(0, 0, w, h).data;
        let outputText = "";

        for (let y = 0; y < h; y++) {
          let row = "";
          for (let x = 0; x < w; x++) {
            const index = (x + y * w) * 4;
            const r = data[index];
            const g = data[index + 1];
            const b = data[index + 2];
            const c = (r + g + b) / 3;
            
            const charIndex = Math.floor((charsLength * ((c * 100) / config.maxColorIndex)) / 100);
            const safeCharIndex = Math.min(Math.max(charIndex, 0), charsLength - 1);
            const result = charsFixed[safeCharIndex];
            const char = Array.isArray(result) ? result[Math.floor(Math.random() * result.length)] : result;

            row += `<span style="color: rgb(${r}, ${g}, ${b});">${char ?? "&nbsp;"}</span>`;
          }
          outputText += `<div>${row}</div>`;
        }

        output.innerHTML = outputText;
        output.style.setProperty("--color", `rgb(${data[0]}, ${data[1]}, ${data[2]})`);

      } catch (err) {}

      requestAnimationFrame(updateASCII);
    };

    requestAnimationFrame(updateASCII);
  })();
</script>

</body>
</html>
